services:
  sqlserver:
    image: ://microsoft.com
    container_name: sqlserver_net
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "experis.api"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    build: .
    container_name: productInventory_Api
    restart: always
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection:  "Server=sqlserver;Database=InventoryDb;User Id=sa;Password=experis.api;TrustServerCertificate=True;"
    depends_on:
      sqlserver:
        condition: service_started

volumes:
  sqlserver_data:
